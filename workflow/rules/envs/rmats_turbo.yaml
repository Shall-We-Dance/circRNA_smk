name: rmats_turbo
channels: [conda-forge, bioconda]
dependencies:
  - python=3.9
  - cython=0.29
  - numpy
  - scipy
  - gsl
  - libblas
  - liblapack
  # rMATS-turbo v4.3.0 vendors bamtools with an old CMake policy version.
  # CMake 4 rejects that project during configure, so keep this build on 3.x.
  - cmake<4
  - make
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - git
  - samtools
  - zlib
