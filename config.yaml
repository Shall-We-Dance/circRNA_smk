# Sanitized template configuration for circRNA_smk.
# Replace all /path/to/... placeholders and sample/group labels before running.

threads:
  merge_fastq: 2          # merge lane FASTQ files by sample
  fastp: 3                # fastp --thread
  star: 16                # STAR --runThreadN
  bwa: 16                 # bwa mem -t for CIRI3 remap
  samtools_index: 8       # samtools index -@
  samtools_view: 8        # samtools view -@ for CIRI3 prep
  featurecounts: 8        # featureCounts -T
  faidx: 2                # samtools faidx
  homer: 8                # findMotifs.pl -p
  splicing_stats: 2       # per-sample and merged splicing-site summaries
  igv_bigwig: 8           # RNA-seq BigWig track generation
  rmats: 8                # rMATS-turbo --nthread
  sashimi: 2              # Snakemake scheduling threads for rmats2sashimiplot jobs
  circtools_detect: 16    # circtools detect / STAR helper jobs

output:
  dir: "results"
  keep_bam: false

reference:
  star_index: "/path/to/reference/star_index"
  fasta: "/path/to/reference/genome.fa"
  bwa_indexed_fasta: "/path/to/reference/genome.fa"
  gtf: "/path/to/reference/annotation.gtf"
  # Optional GFF3 for rmats2sashimiplot coordinate-mode annotation.
  # gff3: "/path/to/reference/annotation.gff3"

samples:
  sample_A_rep1:
    R1:
      - "/path/to/fastq/sample_A_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep1_R2.fastq.gz"
  sample_A_rep2:
    R1:
      - "/path/to/fastq/sample_A_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep2_R2.fastq.gz"
  sample_A_rep3:
    R1:
      - "/path/to/fastq/sample_A_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep3_R2.fastq.gz"

  sample_B_rep1:
    R1:
      - "/path/to/fastq/sample_B_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep1_R2.fastq.gz"
  sample_B_rep2:
    R1:
      - "/path/to/fastq/sample_B_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep2_R2.fastq.gz"
  sample_B_rep3:
    R1:
      - "/path/to/fastq/sample_B_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep3_R2.fastq.gz"

  sample_C_rep1:
    R1:
      - "/path/to/fastq/sample_C_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep1_R2.fastq.gz"
  sample_C_rep2:
    R1:
      - "/path/to/fastq/sample_C_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep2_R2.fastq.gz"
  sample_C_rep3:
    R1:
      - "/path/to/fastq/sample_C_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep3_R2.fastq.gz"

fastp:
  extra_args: ""
  dedup_adapter:
    dedup: true

ciri3:
  enabled: true

deg:
  # These groups/comparisons are shared by CIRI3 DEG, sashimi, and circtools.
  groups:
    condition_A:
      - sample_A_rep1
      - sample_A_rep2
      - sample_A_rep3
    condition_B:
      - sample_B_rep1
      - sample_B_rep2
      - sample_B_rep3
    condition_C:
      - sample_C_rep1
      - sample_C_rep2
      - sample_C_rep3

  # the normal target graph and feed both CIRI3 DEG plots and BSJ sashimi plots.
  run_deseq2: true
  run_de_bsj: true
  run_de_ratio: true
  run_de_relative: true
  ciri3_gene_expression_from_featurecounts: true

  min_total_count: 10
  min_samples_detected: 2
  padj_cutoff: 0.05
  lfc_cutoff: 1.0

motif:
  # Run BSJ-centered motif analysis with HOMER from CIRI3 BSJ sites.
  enabled: true
  # Sequence window size on each side of the BSJ donor/acceptor site.
  flank: 30
  # How to weight each BSJ when aggregating site support for sequence export:
  # sum | mean | none
  weight_mode: "sum"
  # Motif lengths for HOMER findMotifs.pl, comma-separated.
  homer_len: "8,10,12"

splicing_stats:
  # Per-sample BSJ/FSJ splice-site summary, ABS tables, overview plots, and
  # IGV-loadable BSJ BED tracks.
  enabled: true

rmats_turbo:
  # Run rMATS-turbo on STAR coordinate-sorted BAMs for configured groups and
  # pairwise contrasts; BSJ-centered sashimi plots are handled by sashimi below.
  enabled: true
  repo_url: "https://github.com/Xinglab/rmats-turbo.git"
  ref: "v4.3.0"
  read_length: 150
  read_type: "paired"
  lib_type: "fr-unstranded"
  variable_read_length: true
  allow_clipping: false
  novel_splice_sites: false
  paired_stats: false
  statoff: false
  individual_counts: false
  event_types: ["SE", "A5SS", "A3SS", "MXE", "RI"]
  count_types: ["JC", "JCEC"]

sashimi:
  # Plot BSJ-centered sashimi PDFs from DESeq2 and enabled CIRI3 DEG methods.
  enabled: true
  # Keep ordinary rMATS event sashimi plots off by default; BSJ plots are the
  # main visualization target for this workflow.
  plot_rmats_events: false
  repo_url: "https://github.com/Xinglab/rmats2sashimiplot.git"
  ref: "v3.0.0"
  count_type: "JC"
  fdr_cutoff: 0.05
  pvalue_cutoff: 1.0
  inc_diff_cutoff: 0.1
  max_events_per_comparison_type: 0
  bsj_flank: 250
  min_counts: 1
  exon_s: 1
  intron_s: 5
  auto_scale: true
  font_size: 8
  min_font_size: 6
  fig_width: 8
  fig_height: 0
  min_fig_width: 8
  max_fig_width: 18
  min_fig_height: 4.5
  max_fig_height: 12
  fail_on_error: false
  colors:
    - "#4C78A8"
    - "#F58518"
    - "#54A24B"
    - "#B279A2"
    - "#E45756"

circrna_plots:
  enabled: true

circtools:
  enabled: true

  detect:
    enabled: true
    stranded: true
    second_strand: false
    filter: true
    remove_chrM: true
    filter_by_gene: true
    host_gene: true
    repeats_gtf: ""
    count_threshold: 2
    replicate_threshold: 3

  circtest:
    enabled: true
    max_fdr: 0.05
    percentage: 0.01
    filter_sample: 3
    filter_count: 5
    max_plots: 50

  primex:
    # circtools primex designs outward-facing primer pairs for selected circRNA
    # candidates. Keep disabled unless you need experimental validation primer
    # design outputs under results/circtools/primex/.
    enabled: false
    top_n: 25
    product_size: [80, 160]
    num_pairs: 5
    # r = reverse primer on BSJ, f = forward primer on BSJ, n = neither.
    junction: "n"
    # Leave organism empty for non-bundled organisms such as Aedes aegypti.
    organism: ""
    no_blast: true

  quickcheck:
    enabled: true
