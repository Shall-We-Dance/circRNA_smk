# Sanitized template configuration for circRNA_smk.
# Replace all /path/to/... placeholders and sample/group labels before running.

threads:
  merge_fastq: 2          # merge lane FASTQ files by sample
  fastp: 3                # fastp --thread
  star: 16                # STAR --runThreadN
  bwa: 16                 # bwa mem -t for CIRI3 remap
  samtools_index: 8       # samtools index -@
  samtools_view: 8        # samtools view -@ for CIRI3 prep
  featurecounts: 8        # featureCounts -T
  faidx: 2                # samtools faidx
  homer: 8                # findMotifs.pl -p
  splicing_stats: 2       # per-sample and merged splicing-site summaries
  rmats: 8                # rMATS-turbo --nthread
  sashimi: 2              # Snakemake scheduling threads for rmats2sashimiplot jobs
  circtools_detect: 16    # circtools detect / STAR helper jobs

output:
  dir: "results"
  keep_bam: false

reference:
  star_index: "/path/to/reference/star_index"
  fasta: "/path/to/reference/genome.fa"
  bwa_indexed_fasta: "/path/to/reference/genome.fa"
  gtf: "/path/to/reference/annotation.gtf"
  # Optional GFF3 for rmats2sashimiplot coordinate-mode annotation.
  # gff3: "/path/to/reference/annotation.gff3"

samples:
  sample_A_rep1:
    R1:
      - "/path/to/fastq/sample_A_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep1_R2.fastq.gz"
  sample_A_rep2:
    R1:
      - "/path/to/fastq/sample_A_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep2_R2.fastq.gz"
  sample_A_rep3:
    R1:
      - "/path/to/fastq/sample_A_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_A_rep3_R2.fastq.gz"

  sample_B_rep1:
    R1:
      - "/path/to/fastq/sample_B_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep1_R2.fastq.gz"
  sample_B_rep2:
    R1:
      - "/path/to/fastq/sample_B_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep2_R2.fastq.gz"
  sample_B_rep3:
    R1:
      - "/path/to/fastq/sample_B_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_B_rep3_R2.fastq.gz"

  sample_C_rep1:
    R1:
      - "/path/to/fastq/sample_C_rep1_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep1_R2.fastq.gz"
  sample_C_rep2:
    R1:
      - "/path/to/fastq/sample_C_rep2_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep2_R2.fastq.gz"
  sample_C_rep3:
    R1:
      - "/path/to/fastq/sample_C_rep3_R1.fastq.gz"
    R2:
      - "/path/to/fastq/sample_C_rep3_R2.fastq.gz"

fastp:
  extra_args: ""
  dedup_adapter:
    dedup: true

ciri3:
  enabled: true

deg:
  # These groups/comparisons are shared by CIRI3 DEG, sashimi, and circtools.
  groups:
    condition_A:
      - sample_A_rep1
      - sample_A_rep2
      - sample_A_rep3
    condition_B:
      - sample_B_rep1
      - sample_B_rep2
      - sample_B_rep3
    condition_C:
      - sample_C_rep1
      - sample_C_rep2
      - sample_C_rep3

  comparisons:
    condition_B_vs_condition_A:
      case_group: condition_B
      control_group: condition_A
    condition_C_vs_condition_A:
      case_group: condition_C
      control_group: condition_A
    condition_C_vs_condition_B:
      case_group: condition_C
      control_group: condition_B

  run_deseq2: false
  run_de_bsj: false
  run_de_ratio: false
  run_de_relative: false
  ciri3_gene_expression_from_featurecounts: false

motif:
  enabled: false

splicing_stats:
  enabled: false

rmats_turbo:
  enabled: false

sashimi:
  enabled: false

circrna_plots:
  enabled: false

circtools:
  enabled: true

  detect:
    enabled: true
    stranded: true
    second_strand: false
    filter: true
    remove_chrM: true
    filter_by_gene: true
    host_gene: true
    repeats_gtf: ""
    count_threshold: 2
    replicate_threshold: 3

  circtest:
    enabled: true
    max_fdr: 0.05
    percentage: 0.01
    filter_sample: 3
    filter_count: 5
    max_plots: 50

  primex:
    enabled: false

  quickcheck:
    enabled: true
