threads:
  merge_fastq: 2          # merge lane FASTQ files by sample
  fastp: 8                # fastp --thread
  star: 16                # STAR --runThreadN
  bwa: 16                 # bwa mem -t (for CIRI3 remap)
  samtools_index: 8       # samtools index -@
  samtools_view: 8        # samtools view -@ (CIRI3 prep)
  featurecounts: 8        # featureCounts -T
  faidx: 2                # samtools faidx (reference index)
  homer: 8                # findMotifs.pl -p
  splicing_stats: 2       # per-sample and merged splicing-site summaries
  rmats: 8                # rMATS-turbo --nthread
  sashimi: 2              # Snakemake scheduling threads for rmats2sashimiplot jobs

reference:
  # STAR genome index folder (must be prebuilt, e.g. contains SA file)
  star_index: "resources/genomeIndex/refGen"
  # Example: GCF_002204515.2.fa
  fasta: "resources/genomeIndex/GCF_002204515.2.fa"
  # FASTA path used as BWA index prefix. Must already have:
  # <bwa_indexed_fasta>.amb/.ann/.bwt/.pac/.sa
  bwa_indexed_fasta: "resources/genomeIndex/GCF_002204515.2.fa"
  # Example: GCF_002204515.2_AaegL5.0.ncbiRefSeq.gtf
  gtf: "resources/genomeIndex/GCF_002204515.2_AaegL5.0.ncbiRefSeq.gtf"

samples:
  sampleA:
    R1:
      - "raw/sampleA_rep1_r1.fastq.gz"
      - "raw/sampleA_rep2_r1.fastq.gz"
      - "raw/sampleA_rep3_r1.fastq.gz"
    R2:
      - "raw/sampleA_rep1_r2.fastq.gz"
      - "raw/sampleA_rep2_r2.fastq.gz"
      - "raw/sampleA_rep3_r2.fastq.gz"

  sampleB:
    R1:
      - "raw/sampleB_R1.fastq.gz"
    R2:
      - "raw/sampleB_R2.fastq.gz"

  sampleC:
    R1:
      - "raw/sampleC_R1.fastq.gz"
    R2:
      - "raw/sampleC_R2.fastq.gz"

  sampleD:
    R1:
      - "raw/sampleD_R1.fastq.gz"
    R2:
      - "raw/sampleD_R2.fastq.gz"

  sampleE:
    R1:
      - "raw/sampleE_R1.fastq.gz"
    R2:
      - "raw/sampleE_R2.fastq.gz"

  sampleF:
    R1:
      - "raw/sampleF_R1.fastq.gz"
    R2:
      - "raw/sampleF_R2.fastq.gz"

  sampleG:
    R1:
      - "raw/sampleG_R1.fastq.gz"
    R2:
      - "raw/sampleG_R2.fastq.gz"

  sampleH:
    R1:
      - "raw/sampleH_R1.fastq.gz"
    R2:
      - "raw/sampleH_R2.fastq.gz"

  sampleI:
    R1:
      - "raw/sampleI_R1.fastq.gz"
    R2:
      - "raw/sampleI_R2.fastq.gz"

fastp:
  # dedup + adapter trimming
  dedup_adapter:
    dedup: true

ciri3:
  # CIRI3 source is cloned automatically; official GitHub tag for CIRI-3.0.1 is v3.0.1
  repo_url: "https://github.com/gyjames/CIRI3.git"
  ref: "v3.0.1"
  # CIRI3 main parameters
  Ma: 1
  W: 1

motif:
  # run BSJ-centered motif analysis with HOMER based on all_samples.ciri3.BSJ_Matrix
  enabled: true
  # sequence window size on each side of BSJ donor/acceptor site
  flank: 30
  # how to weight each BSJ when aggregating site-level support for sequence export: sum | mean | none
  weight_mode: "sum"
  # motif lengths for HOMER findMotifs.pl, comma-separated
  homer_len: "8,10,12"

output:
  dir: "results"
  # keep STAR/BWA BAM files after pipeline finishes
  keep_bam: false

deg:
  # run BSJ differential analysis with DESeq2
  run_deseq2: true
  # CIRI3 differential analysis options
  run_de_bsj: true
  run_de_ratio: true
  run_de_relative: true
  ciri3_gene_expression_from_featurecounts: true
  # minimum BSJ count across selected samples
  min_total_count: 10
  # minimum number of selected samples with BSJ count > 0
  min_samples_detected: 2
  # significance thresholds used for labels and volcano highlighting
  padj_cutoff: 0.05
  lfc_cutoff: 1.0
  # group name -> sample names (must exist in "samples")
  groups:
    conditionX:
      - sampleA
      - sampleB
      - sampleC
    conditionY:
      - sampleD
      - sampleE
      - sampleF
    conditionZ:
      - sampleG
      - sampleH
      - sampleI

rmats_turbo:
  # run rMATS-turbo on STAR coordinate-sorted BAMs separately for each deg.group.
  # The workflow uses --b1 plus --statoff for each group, so rMATS counts AS
  # events without doing a pairwise statistical comparison.
  enabled: true
  repo_url: "https://github.com/Xinglab/rmats-turbo.git"
  ref: "v4.3.0"
  # rMATS requires --readLength even when --variable-read-length is enabled;
  # set this to your library's nominal read length after trimming/alignment.
  read_length: 150
  read_type: "paired"
  lib_type: "fr-unstranded"
  variable_read_length: true
  allow_clipping: false
  novel_splice_sites: false
  paired_stats: false
  statoff: false
  individual_counts: false
  event_types: ["SE", "A5SS", "A3SS", "MXE", "RI"]
  count_types: ["JC", "JCEC"]

sashimi:
  # plot significant BSJ sites from DESeq2 and enabled CIRI3 DEG methods.
  # Each method/comparison gets its own directory, and every selected BSJ is
  # plotted across all deg.groups with rmats2sashimiplot coordinate mode.
  # The workflow keeps the full annotation plot under plots/ and also writes a
  # BSJ-only annotation-track version under plots_bsj_only/.
  enabled: true
  repo_url: "https://github.com/Xinglab/rmats2sashimiplot.git"
  ref: "v3.0.0"
  # Optional GFF3 annotation for coordinate mode. If omitted, the workflow
  # creates a GFF3 from reference.gtf.
  # annotation_gff3: "resources/genomeIndex/annotation.gff3"
  count_type: "JC"
  fdr_cutoff: 0.05
  pvalue_cutoff: 1.0
  inc_diff_cutoff: 0.1
  # 0 means plot all significant BSJs per method/comparison; use a positive
  # number for quick runs.
  max_events_per_comparison_type: 0
  # Bases added to each side of the BSJ span for coordinate-mode sashimi plots.
  bsj_flank: 250
  min_counts: 0
  exon_s: 1
  intron_s: 5
  # Automatically enlarge BSJ sashimi PDFs for wider loci, more groups/samples,
  # or long BSJ labels. The configured width/height/font act as starting values.
  auto_scale: true
  font_size: 8
  min_font_size: 6
  fig_width: 8
  # With auto_scale: false, 0 lets rmats2sashimiplot choose the default height.
  fig_height: 0
  min_fig_width: 8
  max_fig_width: 18
  min_fig_height: 4.5
  max_fig_height: 12
  fail_on_error: false
  colors:
    - "#4C78A8"
    - "#F58518"
    - "#54A24B"
    - "#B279A2"
    - "#E45756"
